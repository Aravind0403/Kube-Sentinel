name: CI - Kube-Sentinel Plugin & Sidecar Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go-plugin:
    name: Go Scheduler Plugin & Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'v2/go_plugin/go.mod'
          cache-dependency-path: v2/go_plugin/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Go Plugin Unit & Native Failover Acceptance Tests
        run: |
          cd v2/go_plugin
          export SENTINEL_ACCEPTANCE_PYTHON=$(which python3)
          go test -race -count=1 -v ./...

  test-python-sidecar:
    name: Python Sidecar & Integration Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Telemetry Confidence Math
        run: |
          python3 v2/verify_confidence.py

      - name: Run Offline Policy Simulation
        run: |
          python3 scripts/replay_policy.py --jobs 50

      - name: Run Scale Jitter Benchmark
        run: |
          python3 scripts/benchmark_telemetry.py --ticks 3

      - name: Run gRPC Latency Knee Test
        run: |
          python3 scripts/benchmark_grpc.py --candidate-nodes 16 --max-burst 250
